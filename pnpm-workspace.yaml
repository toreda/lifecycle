allowBuilds:
    '@swc/core': true
    es5-ext: true
    unrs-resolver: true
minimumReleaseAgeExclude:
    - '@toreda/eslint-config@4.0.0'
    - '@toreda/log@1.0.0'
    - '@toreda/prettier-config@2.0.0'

overrides:
    'jest': '^30.4.0'
    'jest-cli': '^30.4.0'
    'jest-runtime': '^30.4.0'
    'jest-mock': '^30.4.0'
    'jest-circus': '^30.4.0'
    'jest-config': '^30.4.0'
    'jest-environment-node': '^30.4.0'
    'jest-environment-jsdom': '^30.4.0'
    '@jest/core': '^30.4.0'
    '@jest/environment': '^30.4.0'
    '@jest/fake-timers': '^30.4.0'
    '@jest/globals': '^30.4.0'
    '@jest/test-sequencer': '^30.4.0'
    '@jest/transform': '^30.4.0'
    '@jest/types': '^30.4.0'
    '@typescript-eslint/eslint-plugin': '^8.48.0'
    '@typescript-eslint/parser': '^8.48.0'
    '@typescript-eslint/typescript-estree': '^8.48.0'
    '@typescript-eslint/type-utils': '^8.48.0'
    '@typescript-eslint/utils': '^8.48.0'
    '@typescript-eslint/scope-manager': '^8.48.0'
    '@typescript-eslint/visitor-keys': '^8.48.0'
    '@typescript-eslint/types': '^8.48.0'
